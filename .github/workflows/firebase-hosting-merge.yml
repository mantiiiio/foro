name: Deploy MantiPobres to Firebase Hosting

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: firebase-hosting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js for validation and Firebase CLI
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Stamp release version for automatic browser updates
        run: |
          sed -i "s/__MP_BUILD_ID__/${GITHUB_SHA}/g" index.html build-version.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads(Path("build-version.json").read_text())["version"]
          assert version == os.environ["GITHUB_SHA"], "El marcador local no coincide con el commit."
          PY


      - name: Validate application JavaScript syntax
        run: |
          sed -n '/<script type="module">/,/<\\/script>/p' index.html | sed '1d;$d' > /tmp/mantipobres-app.mjs
          node --check /tmp/mantipobres-app.mjs

      - name: Verify the retired online chat UI is absent
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("index.html").read_text(encoding="utf-8")
          forbidden = [
              'id="chatBox"', 'id="chatMessages"', 'id="chatForm"',
              'id="chatShortcutDialog"', 'id="chatSend"', 'id="chatText"',
              'id="chatCatbox"', 'id="chatAdmin"', 'id="sr"',
              'function subscribeChat(', 'function renderChat(',
              'function uploadChatFile('
          ]
          found = [item for item in forbidden if item in source]
          if found:
              raise SystemExit("Interfaz de chat retirada encontrada: " + ", ".join(found))
          print("Correcto: la interfaz y los handlers del chat no están en index.html.")
          PY

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.35.0

      - name: Install Firestore rules test dependencies
        run: npm install --no-package-lock

      - name: Run board search unit tests
        run: npm run test:board-search

      - name: Run Firestore security tests in the local emulator
        run: firebase emulators:exec --only firestore --project demo-mantipobres-rules "npm run test:rules"

      - name: Authenticate for Firestore rules deployment
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FORO_66DD5 }}

      - name: Deploy Firestore rules before the live UI
        run: firebase deploy --only firestore:rules --project foro-66dd5 --non-interactive

      - name: Deploy live site
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FORO_66DD5 }}
          channelId: live
          projectId: foro-66dd5
          target: main

      - name: Verify public sitemap and robots after deployment
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 3 --fail --silent --show-error -D /tmp/mantipobres-version-headers.txt "https://mantipobres.web.app/build-version.json?verify=$GITHUB_SHA" -o /tmp/mantipobres-version.json
          grep -Eiq '^cache-control:.*no-store' /tmp/mantipobres-version-headers.txt
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads(Path("/tmp/mantipobres-version.json").read_text())["version"]
          assert version == os.environ["GITHUB_SHA"], f"Versión publicada {version} != commit {os.environ['GITHUB_SHA']}"
          print(f"Versión automática verificada: {version}")
          PY
          curl --retry 5 --retry-all-errors --retry-delay 3 --fail --silent --show-error \
            -D /tmp/mantipobres-sitemap-headers.txt \
            https://mantipobres.web.app/sitemap.xml \
            -o /tmp/mantipobres-sitemap.xml
          grep -Eiq '^content-type: application/xml([;[:space:]]|$)' /tmp/mantipobres-sitemap-headers.txt
          curl --retry 5 --retry-all-errors --retry-delay 3 --fail --silent --show-error \
            https://mantipobres.web.app/robots.txt \
            -o /tmp/mantipobres-robots.txt
          grep -Fq 'Sitemap: https://mantipobres.web.app/sitemap.xml' /tmp/mantipobres-robots.txt
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse("/tmp/mantipobres-sitemap.xml").getroot()
          namespace = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          locations = [node.text for node in root.findall("sm:url/sm:loc", namespace)]
          assert root.tag == "{http://www.sitemaps.org/schemas/sitemap/0.9}urlset", "Raíz XML no válida"
          assert len(locations) >= 1, "El sitemap no contiene direcciones"
          assert all(url and url.startswith("https://mantipobres.web.app/") for url in locations), "Hay una URL fuera del dominio público"
          print(f"Sitemap público verificado: {len(locations)} URL; XML válido.")
          PY
