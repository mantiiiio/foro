name: Deploy MantiPobres to Firebase Hosting

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js for validation and Firebase CLI
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate application JavaScript syntax
        run: |
          sed -n '/<script type="module">/,/<\\/script>/p' index.html | sed '1d;$d' > /tmp/mantipobres-app.mjs
          node --check /tmp/mantipobres-app.mjs

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.35.0

      - name: Install Firestore rules test dependencies
        run: npm install --no-package-lock

      - name: Run Firestore security tests in the local emulator
        run: firebase emulators:exec --only firestore --project demo-mantipobres-rules "npm run test:rules"

      - name: Authenticate for Firestore rules deployment
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FORO_66DD5 }}

      - name: Deploy Firestore rules before the live UI
        run: firebase deploy --only firestore:rules,firestore:indexes --project foro-66dd5 --non-interactive

      - name: Deploy live site
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FORO_66DD5 }}
          channelId: live
          projectId: foro-66dd5
          target: main
