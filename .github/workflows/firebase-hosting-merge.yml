name: Deploy MantiPobres to Firebase Hosting

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: firebase-hosting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js for validation and Firebase CLI
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Stamp release version for automatic browser updates
        run: |
          sed -i "s/__MP_BUILD_ID__/${GITHUB_SHA}/g" index.html build-version.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads(Path("build-version.json").read_text())["version"]
          assert version == os.environ["GITHUB_SHA"], "El marcador local no coincide con el commit."
          PY

      - name: Generate a strict Content Security Policy for this exact app build
        run: |
          python3 - <<'PY'
          import base64, hashlib, json
          from pathlib import Path
          source = Path("index.html").read_text(encoding="utf-8")
          opening, closing = '<script type="module">', '</script>'
          if opening not in source:
              raise SystemExit("No se encontró el script de la aplicación para calcular su hash CSP.")
          script = source.split(opening, 1)[1].split(closing, 1)[0]
          digest = base64.b64encode(hashlib.sha256(script.encode("utf-8")).digest()).decode("ascii")
          config_path = Path("firebase.json")
          config = json.loads(config_path.read_text(encoding="utf-8"))
          header = next(
              (item for group in config["hosting"]["headers"] if group["source"] == "**"
               for item in group["headers"] if item["key"] == "Content-Security-Policy"),
              None
          )
          if not header or "__MP_SCRIPT_HASH__" not in header["value"]:
              raise SystemExit("No se encontró el marcador del hash CSP en firebase.json.")
          header["value"] = header["value"].replace("__MP_SCRIPT_HASH__", "'sha256-" + digest + "'")
          policy = header["value"]
          if "script-src-attr 'none'" not in policy or "'unsafe-inline'" in policy.split("script-src ", 1)[1].split(";", 1)[0]:
              raise SystemExit("La política CSP permite scripts inline no autorizados.")
          if "'sha256-" + digest + "'" not in policy or "object-src 'none'" not in policy or "frame-ancestors 'none'" not in policy:
              raise SystemExit("La política CSP no contiene todas las restricciones obligatorias.")
          config_path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
          print("CSP estricta generada y vinculada al hash SHA-256 del script de esta versión.")
          PY



      - name: Validate that CSP has no inline event handlers and the stamped script hash matches
        run: |
          python3 - <<'PY'
          import base64, hashlib, json
          from pathlib import Path
          source = Path("index.html").read_text(encoding="utf-8")
          if 'onclick="' in source or 'onerror="' in source or 'onload="' in source:
              raise SystemExit("Hay un manejador HTML inline que no funcionará bajo CSP.")
          script = source.split('<script type="module">', 1)[1].split('</script>', 1)[0]
          digest = base64.b64encode(hashlib.sha256(script.encode("utf-8")).digest()).decode("ascii")
          config = json.loads(Path("firebase.json").read_text(encoding="utf-8"))
          policy = next(item["value"] for group in config["hosting"]["headers"] if group["source"] == "**"
                        for item in group["headers"] if item["key"] == "Content-Security-Policy")
          assert "'sha256-" + digest + "'" in policy, "El hash CSP no coincide con el script que se va a publicar."
          assert "__MP_SCRIPT_HASH__" not in policy, "Quedó un marcador CSP sin reemplazar."
          assert "script-src-attr 'none'" in policy and "object-src 'none'" in policy and "frame-ancestors 'none'" in policy
          print("CSP comprobada: sin inline scripts ni manejadores HTML no autorizados.")
          PY

      - name: Validate application JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("index.html").read_text(encoding="utf-8")
          opening = '<script type="module">'
          closing = '</script>'
          if opening not in source:
              raise SystemExit("No se encontró el script principal de la aplicación.")
          script = source.split(opening, 1)[1].split(closing, 1)[0]
          if not script.strip():
              raise SystemExit("El script principal de la aplicación está vacío.")
          Path("/tmp/mantipobres-app.mjs").write_text(script, encoding="utf-8")
          PY
          node --check /tmp/mantipobres-app.mjs
          node --check board-search.js
          python3 - <<'PY'
          from pathlib import Path
          source = Path("index.html").read_text(encoding="utf-8")
          required = [
              'from "/board-search.js"',
              'id="globalTopicSearch"',
              'async function srch(',
              'search:srch',
              'class="communityRules"',
              'Reglas de la comunidad',
              'Este apartado es informativo y de solo lectura.',
              'El apartado de reglas es informativo y no admite publicaciones.',
              'class="topicMaintenanceShell"',
              'class="topicMaintenanceBlur" inert',
              'Estamos teniendo problemas con el proyecto/tema.',
              'link.removeAttribute("href")',
              'async editOriginalPost(',
              'function openTopicOriginalPostEditor(',
              'data-edit-gallery-add',
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit("Faltan funciones del buscador: " + ", ".join(missing))
          if 'from "./board-search.js"' in source:
              raise SystemExit("No se permite importar el buscador con una ruta relativa desde /b/ o /t/.")
          print("Rutas absolutas, búsqueda por foro, búsqueda global y editor de adjuntos verificados.")
          PY
          python3 - <<'PY'
          from pathlib import Path
          rules = Path("firestore.rules").read_text(encoding="utf-8")
          required = [
              "request.resource.data.diff(resource.data).affectedKeys().hasOnly(['gallery'])",
              "request.resource.data.gallery is list",
              "request.resource.data.gallery.size() <= 10",
              "function validGalleryEntry(entry)",
              "function validGalleryList(gallery)",
              "validGalleryList(request.resource.data.gallery)"
          ]
          missing = [item for item in required if item not in rules]
          if missing:
              raise SystemExit("Falta el permiso controlado para editar adjuntos en Firestore: " + ", ".join(missing))
          print("Permisos de edición de adjuntos verificados en firestore.rules.")
          # Firebase Storage está deshabilitado en este proyecto y la aplicación no lo utiliza.
          if "storage" in __import__("json").loads(Path("firebase.json").read_text(encoding="utf-8")):
              raise SystemExit("No se debe desplegar Firebase Storage mientras el producto no esté habilitado.")
          print("Storage no se utiliza ni se despliega; las subidas desde la aplicación están deshabilitadas.")
          PY

      - name: Verify the retired online chat UI is absent
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("index.html").read_text(encoding="utf-8")
          forbidden = [
              'id="chatBox"', 'id="chatMessages"', 'id="chatForm"',
              'id="chatShortcutDialog"', 'id="chatSend"', 'id="chatText"',
              'id="chatCatbox"', 'id="chatAdmin"', 'id="sr"',
              'function subscribeChat(', 'function renderChat(',
              'function uploadChatFile('
          ]
          found = [item for item in forbidden if item in source]
          if found:
              raise SystemExit("Interfaz de chat retirada encontrada: " + ", ".join(found))
          print("Correcto: la interfaz y los handlers del chat no están en index.html.")
          PY

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.35.0

      - name: Install Firestore rules test dependencies
        run: npm install --no-package-lock

      - name: Run board search unit tests
        run: npm run test:board-search

      - name: Run Firestore security tests in the local emulator
        run: firebase emulators:exec --only firestore --project demo-mantipobres-rules "npm run test:rules"

      - name: Authenticate for Firestore rules deployment
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FORO_66DD5 }}

      - name: Deploy Firestore rules before the live UI
        run: firebase deploy --only firestore:rules --project foro-66dd5 --non-interactive

      - name: Deploy live site
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FORO_66DD5 }}
          channelId: live
          projectId: foro-66dd5
          target: main

      - name: Verify forum search module and deep forum routes are publicly served
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 3 --fail --silent --show-error \
            -D /tmp/mantipobres-search-headers.txt \
            "https://mantipobres.web.app/board-search.js?verify=$GITHUB_SHA" \
            -o /tmp/mantipobres-board-search.js
          grep -Eiq '^content-type:.*(javascript|ecmascript)' /tmp/mantipobres-search-headers.txt
          grep -Fq 'normalizeTopicSearchText' /tmp/mantipobres-board-search.js
          curl --retry 5 --retry-all-errors --retry-delay 3 --fail --silent --show-error \
            "https://mantipobres.web.app/b/gen?verify=$GITHUB_SHA" \
            -o /tmp/mantipobres-forum-route.html
          grep -Fq 'from "/board-search.js"' /tmp/mantipobres-forum-route.html
      - name: Verify public sitemap and robots after deployment
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 3 --fail --silent --show-error -D /tmp/mantipobres-version-headers.txt "https://mantipobres.web.app/build-version.json?verify=$GITHUB_SHA" -o /tmp/mantipobres-version.json
          grep -Eiq '^cache-control:.*no-store' /tmp/mantipobres-version-headers.txt
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads(Path("/tmp/mantipobres-version.json").read_text())["version"]
          assert version == os.environ["GITHUB_SHA"], f"Versión publicada {version} != commit {os.environ['GITHUB_SHA']}"
          print(f"Versión automática verificada: {version}")
          PY
          curl --retry 5 --retry-all-errors --retry-delay 3 --fail --silent --show-error \
            -D /tmp/mantipobres-sitemap-headers.txt \
            https://mantipobres.web.app/sitemap.xml \
            -o /tmp/mantipobres-sitemap.xml
          grep -Eiq '^content-type: application/xml([;[:space:]]|$)' /tmp/mantipobres-sitemap-headers.txt
          curl --retry 5 --retry-all-errors --retry-delay 3 --fail --silent --show-error \
            https://mantipobres.web.app/robots.txt \
            -o /tmp/mantipobres-robots.txt
          grep -Fq 'Sitemap: https://mantipobres.web.app/sitemap.xml' /tmp/mantipobres-robots.txt
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse("/tmp/mantipobres-sitemap.xml").getroot()
          namespace = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          locations = [node.text for node in root.findall("sm:url/sm:loc", namespace)]
          assert root.tag == "{http://www.sitemaps.org/schemas/sitemap/0.9}urlset", "Raíz XML no válida"
          assert len(locations) >= 1, "El sitemap no contiene direcciones"
          assert all(url and url.startswith("https://mantipobres.web.app/") for url in locations), "Hay una URL fuera del dominio público"
          print(f"Sitemap público verificado: {len(locations)} URL; XML válido.")
          PY
