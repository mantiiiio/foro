name: Deploy MantiPobres to Firebase Hosting

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js for validation and Firebase CLI
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate application JavaScript syntax
        run: |
          sed -n '/<script type="module">/,/<\\/script>/p' index.html | sed '1d;$d' > /tmp/mantipobres-app.mjs
          node --check /tmp/mantipobres-app.mjs

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.35.0

      - name: Install Firestore rules test dependencies
        run: npm install --no-package-lock

      - name: Run Firestore security tests in the local emulator
        run: firebase emulators:exec --only firestore --project demo-mantipobres-rules "npm run test:rules"

      - name: Authenticate for Firestore rules deployment
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FORO_66DD5 }}

      - name: Deploy Firestore rules before the live UI
        run: firebase deploy --only firestore:rules --project foro-66dd5 --non-interactive

      - name: Deploy live site
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FORO_66DD5 }}
          channelId: live
          projectId: foro-66dd5
          target: main

      - name: Verify public sitemap and robots after deployment
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 3 --fail --silent --show-error \
            -D /tmp/mantipobres-sitemap-headers.txt \
            https://mantipobres.web.app/sitemap.xml \
            -o /tmp/mantipobres-sitemap.xml
          grep -Eiq '^content-type: application/xml([;[:space:]]|$)' /tmp/mantipobres-sitemap-headers.txt
          curl --retry 5 --retry-all-errors --retry-delay 3 --fail --silent --show-error \
            https://mantipobres.web.app/robots.txt \
            -o /tmp/mantipobres-robots.txt
          grep -Fq 'Sitemap: https://mantipobres.web.app/sitemap.xml' /tmp/mantipobres-robots.txt
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse("/tmp/mantipobres-sitemap.xml").getroot()
          namespace = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          locations = [node.text for node in root.findall("sm:url/sm:loc", namespace)]
          assert root.tag == "{http://www.sitemaps.org/schemas/sitemap/0.9}urlset", "Raíz XML no válida"
          assert len(locations) >= 1, "El sitemap no contiene direcciones"
          assert all(url and url.startswith("https://mantipobres.web.app/") for url in locations), "Hay una URL fuera del dominio público"
          print(f"Sitemap público verificado: {len(locations)} URL; XML válido.")
          PY
